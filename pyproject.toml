[project]
name = "coder-nexus"
version = "0.1.0"
description = "Coder Nexus - Enterprise Flutter Design-to-Code Platform & MCP Hub"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "mcp>=2.2.0",
    "pydantic>=2.13.5",
    "pytest>=9.1.1",
]

[project.scripts]
coder-nexus = "coder_nexus.cli:main"
skill-factory = "skill_factory.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/coder_nexus", "src/skill_factory"]

[dependency-groups]
dev = [
    "hatchling>=1.32.4",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
